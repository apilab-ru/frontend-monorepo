name: Deploy static app over FTP

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      output:
        required: true
        type: string
      environment:
        required: true
        type: string
      ftp_server:
        type: string
        default: ftp://92.53.119.95
      ftp_username:
        type: string
        default: sites_deploy
      ftp_target_dir:
        required: true
        type: string

permissions:
  contents: read

env:
  NX_DAEMON: 'false'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build production app
        env:
          PROJECT: ${{ inputs.project }}
        run: npx nx build "$PROJECT" --configuration=production
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.project }}-production
          path: ${{ inputs.output }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    concurrency:
      group: ftp-${{ inputs.project }}-production
      cancel-in-progress: false
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER || vars.FTP_SERVER || inputs.ftp_server }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || vars.FTP_USERNAME || inputs.ftp_username }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR || vars.FTP_TARGET_DIR || inputs.ftp_target_dir }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
    steps:
      - name: Validate FTP configuration
        shell: bash
        run: |
          missing=0
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_TARGET_DIR; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name for environment '$DEPLOY_ENVIRONMENT'. Configure it in this repository's Actions settings. FTP_PASSWORD must be an Actions secret."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          case "$FTP_TARGET_DIR" in
            /*) ;;
            *) echo "::error::FTP_TARGET_DIR must be an absolute FTP path"; exit 1 ;;
          esac
          case "${FTP_TARGET_DIR%/}" in
            ""|/|/var|/var/www)
              echo "::error::Refusing unsafe FTP_TARGET_DIR"; exit 1 ;;
          esac

      - uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.project }}-production
          path: artifact

      - name: Install FTP client
        run: |
          sudo apt-get update
          sudo apt-get install --yes lftp

      - name: Synchronize artifact and delete stale remote files
        run: |
          lftp <<EOF
          set cmd:fail-exit yes
          set cmd:interactive no
          set net:timeout 20
          set net:max-retries 2
          set net:reconnect-interval-base 5
          set ftp:ssl-allow no
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          cls -1 "$FTP_TARGET_DIR"
          mirror --reverse --no-perms --verbose --parallel=1 artifact/ "$FTP_TARGET_DIR"
          set cmd:fail-exit no
          mirror --reverse --delete --no-perms --parallel=1 artifact/ "$FTP_TARGET_DIR"
          set cmd:fail-exit yes
          get "$FTP_TARGET_DIR/index.html" -o /tmp/deployed-index.html
          bye
          EOF
          cmp --silent artifact/index.html /tmp/deployed-index.html
