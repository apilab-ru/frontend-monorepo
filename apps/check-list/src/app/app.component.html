<div class="container">
   @for (group of (points$ | async); track group) {
   <h2 class="subtitle">{{ group.title }}</h2>
   <section class="checkbox">
      @for (item of group.list; track item) {
      <mat-checkbox class="checkbox__item"
         >{{ item.text }}
         @if (item.description) {
         <div class="description">( {{ item.description }} )</div>
         }
      </mat-checkbox>
      }
   </section>
   }
</div>
