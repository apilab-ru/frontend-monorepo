<div class="root">
   @for (item of menu; track item; let index = $index) {
   <a class="link" [routerLink]="item.path" routerLinkActive="-selected">
      <span class="link_icon {{ item.icon }}"></span>
      <span class="link_name">{{ item.name }}</span>
   </a>
   }

   <div class="sub-menu">
      <ng-content></ng-content>
   </div>
</div>
