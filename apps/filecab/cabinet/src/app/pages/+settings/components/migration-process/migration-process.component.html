<div class="root">
   @if (currentItem$ | async; as currentItem) {
   <div class="edit-item">
      <filecab-edit-item
         [meta]="meta$ | async"
         [name]="form.controls.name.value"
         [type]="form.controls.type.value"
         (nameChange)="form.controls.name.patchValue($event)"
         (typeChange)="form.controls.type.patchValue($event)"
         (metaChange)="updateMeta($event)"
      ></filecab-edit-item>
      <div class="controls">
         <p-button label="Пропустить" (click)="skip()"></p-button>
         <span class="counter"> / {{ process?.length }} </span>
      </div>
   </div>
   <div class="list-result">
      <div class="list-content">
         @if (isLoading$ | async) { @for (item of preloaderItems; track item) {
         <p-skeleton width="180px" height="243px"></p-skeleton>
         } } @else { @for (item of items$ | async; track item) {
         <filecab-media-item
            class="media-item"
            [mediaItem]="item"
            (click)="select(item, currentItem.item)"
         ></filecab-media-item>
         } @if (!(items$ | async)?.length) {
         <div class="message">Нет результатов</div>
         } }
      </div>
   </div>
   }
</div>
