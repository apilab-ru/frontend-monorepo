<div class="root">
   @if (isLoading) {
   <div class="preloader">
      <p-skeleton class="preloader-item" height="60px"></p-skeleton>
   </div>
   } @if (!isLoading && isSearchMode) {
   <div class="list-box" uiKitHorizontalScroll>
      <div class="list">
         @for (item of list; track item) {
         <filecab-media-item
            class="list-item"
            [mediaItem]="item"
            [genres]="genres"
            (click)="selectItem.emit(item)"
         ></filecab-media-item>
         }
      </div>
      @if (!list?.length) {
      <div class="message">Не найдено материалов</div>
      }
   </div>
   } @if (!isSearchMode && !isLoading && mediaItem) {
   <div class="selected-box">
      <button
         pButton
         pRipple
         type="button"
         icon="pi pi-pencil"
         class="p-button-rounded p-button-outlined icon-edit"
         (click)="setSearchMode()"
      ></button>
      <filecab-media-item class="selected-item" [mediaItem]="mediaItem" [genres]="genres"></filecab-media-item>
   </div>
   }
</div>
