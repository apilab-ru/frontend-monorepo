<div class="root je-box">
   <header class="document-bar je-box">
      <div class="document-name je-box">
         <span class="document-icon je-box" aria-hidden="true">◇</span> {{ fileName() }}
         <span class="document-format je-box">JSON</span>
      </div>
      <div class="buttons je-box">
         @if (isChanged()) { <span class="unsaved je-box">Unsaved changes</span
         ><button
            type="button"
            class="button save je-box je-control je-interactive je-button"
            (click)="saveJson()"
         >
            Save changes
         </button>
         }<button
            type="button"
            class="button delete je-box je-control je-interactive je-button"
            (click)="deleteFile()"
         >
            Delete file
         </button>
      </div>
   </header>
   <div class="workspace je-box">
      <section class="browser je-box" aria-label="JSON column browser">
         <nav class="paths je-box" aria-label="JSON path">
            <span class="view-icon je-box" aria-hidden="true">▥</span
            ><button
               type="button"
               class="root-path path-button je-box je-control je-interactive je-button"
               (click)="goToRoot()"
            >
               ◇ root</button
            >@for (path of breadcrumbs(); track path.id) {
            <span class="path-separator je-box" aria-hidden="true">›</span
            ><button
               type="button"
               class="path path-button je-box je-control je-interactive je-button"
               (click)="goToPath(path.path)"
            >
               {{ path.key }}
            </button>
            }
         </nav>
         <div class="rows-box je-box">
            <div class="rows je-box" #rowsBox>
               @for (column of columns(); track column.id; let last = $last) {
               <je-json-row
                  class="row je-box"
                  [class.-last]="last"
                  [key]="column.key"
                  [data]="column.data"
                  [selected]="column.selected"
                  (inspectKey)="inspectKey($event, column.path)"
                  (updateValue)="onUpdateValue($event, column.path)"
               ></je-json-row>
               }
            </div>
         </div>
      </section>
      <je-json-inspector
         class="inspector je-box"
         [value]="inspectedValue()"
         [path]="inspectedPath()"
         [canRename]="canRenameInspectedKey()"
         [error]="inspectorError()"
         (resetError)="inspectorError.set('')"
         (applyChange)="applyInspectorChange($event)"
      ></je-json-inspector>
   </div>
</div>
