<section class="root je-box">
   <header class="title je-box">
      <span class="object-icon je-box" aria-hidden="true">
         {{ isArray() ? '[ ]' : '◇' }}
      </span>
      {{ key() }}
   </header>
   <label class="search je-box" [formGroup]="formGroup"
      ><span class="je-box" aria-hidden="true">⌕</span
      ><input
         class="search-input row-input je-box je-control je-interactive"
         placeholder="Search keys or values…"
         aria-label="Search keys or values"
         formControlName="search"
   /></label>
   <div class="fields-container je-box">
      <div class="fields je-box">
         @for (item of filteredFields(); track item.key) {
         <div class="field je-box" [class.-selected]="selected() === item.key">
            <span
               class="type-icon je-box"
               [class]="'type-icon type-' + item.kind"
               [title]="item.kind"
               aria-hidden="true"
               >{{ item.icon }}</span
            >
            <span class="key je-box" [title]="item.key">{{ item.key }}</span>
            @if (item.type === FieldType.object) {
            <button
               type="button"
               class="value -object je-box je-control je-interactive je-button"
               [attr.aria-label]="'Explore ' + item.key"
               (click)="inspectKey.emit(item.key)"
            >
               {{ item.value }} <span class="chevron je-box" aria-hidden="true">›</span>
            </button>
            } @else {
            <div class="value -simple je-box" [class]="'value -simple type-' + item.kind">
               <input
                  class="value-input row-input je-box je-control je-interactive"
                  [placeholder]="item.kind === 'null' ? 'null' : ''"
                  [attr.aria-label]="'Edit ' + item.key"
                  [ngModel]="item.value"
                  (focus)="inspectKey.emit(item.key)"
                  (click)="inspectKey.emit(item.key)"
                  (ngModelChange)="onUpdateValue(item, $event)"
               />
            </div>
            }
         </div>
         } @empty {
         <p class="empty je-box">No matching fields</p>
         }
      </div>
   </div>
</section>
