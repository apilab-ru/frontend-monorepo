<section class="block-feedback">
   <div class="container">
      <div class="flex__row-left">
         <div>
            <app-title>Отзывы</app-title>
            <p class="text">Прочитайте отзывы моих клиентов, и убедитесь в успешности реализованных проектов.</p>
         </div>
         <app-svg-zigzag></app-svg-zigzag>
      </div>
      <div class="flex__row-right">
         @for (feedback of feedback; track feedback) {
         <app-item-feedback [feedback]="feedback"></app-item-feedback>
         }
      </div>
   </div>
</section>
