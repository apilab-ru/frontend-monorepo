<section class="block-portfolio">
   <div class="container">
      <app-title>{{ 'portfolioPage.title' | transloco }}</app-title>
      <div class="filter">
         <a class="filter__item" [class.-active]="(filter$ | async) === null" (click)="setFilter(null)">
            {{ 'portfolioPage.allProjects' | transloco }}
         </a>
         @for (item of projectTypes; track item) {
         <a class="filter__item" (click)="setFilter(item)" [class.-active]="(filter$ | async) === item">
            {{ item }}
         </a>
         }
      </div>
      <div class="block-projects" #box>
         @for (project of projects$ | async; track trackById($index, project)) {
         <app-project-card class="card" [project]="project" (click)="openDialog(project)"></app-project-card>
         }
      </div>
   </div>
</section>
