<div class="root">
   <h2>Task Mapping</h2>
   @for (item of taskMapList(); track $index; let index = $index) {
   <app-task-map-item class="line"
      [item]="item"
      (deleteItem)="deleteItem(index)"
      (updateItem)="updateItem($event, index)"
    />
   }
   <button mat-raised-button color="primary" (click)="addMapItem()">+ Add</button>
</div>
