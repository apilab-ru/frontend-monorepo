<div class="root" [formGroup]="formGroup">
   <h2 class="title">Edit integration</h2>

   <mat-tab-group (selectedTabChange)="onTabChange($event)">
      @for (type of types; track type) {
      <mat-tab [label]="type"></mat-tab>
      }
   </mat-tab-group>

   @if ((config$ | async)?.message; as message) {
   <div class="card">
      <div class="help" [innerHTML]="message"></div>
   </div>
   } @for (item of fields$ | async; track item) {
   <div class="card">
      <div class="field">
         <span class="name">{{ item.title }}</span> <input class="input" [formControlName]="item.field" />
      </div>
      <div class="help" [innerHTML]="makeHelp(item.help) | async"></div>
   </div>
   }

   <div class="line">
      @if (loading$ | async) {
      <div class="message">
         <h2>Checking</h2>
         <mat-spinner></mat-spinner>
      </div>
      }

      <button class="save" mat-raised-button color="primary" [disabled]="loading$ | async" (click)="save()">
         Save
      </button>
   </div>
</div>
