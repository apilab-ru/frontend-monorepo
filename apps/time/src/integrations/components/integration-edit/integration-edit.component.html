<div class="root" [formGroup]="formGroup()">
   <h2 class="title">Edit integration</h2>

   <mat-tab-group (selectedTabChange)="onTabChange($event)">
      @for (type of types; track type) {
      <mat-tab [label]="type" [disabled]="loading()" />
      }
   </mat-tab-group>

   @if (config().message; as message) {
   <div class="card">
      <div class="help" [innerHTML]="message"></div>
   </div>
   } @for (item of fields(); track item) {
   <div class="card">
      <div class="field">
         <span class="name">{{ item.title }}</span>
         <input class="input" [formControlName]="item.field" />
      </div>
      <div class="help" [innerHTML]="item.help$ | async"></div>
   </div>
   }

   <div class="line">
      @if (loading()) {
      <div class="message">
         <h2>Checking</h2>
         <mat-spinner />
      </div>
      }

      <button
         class="save"
         mat-raised-button
         color="primary"
         [disabled]="loading()"
         (click)="save()"
      >
         Save
      </button>
   </div>
</div>
