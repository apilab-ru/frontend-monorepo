<div class="root">
   @for (item of integrations(); track item; let index = $index) {
   <app-integration-item class="item"
      [integration]="item"
      [disabled]="!calc() || !calc().length"
      (remove)="removeIntegration(index)"
      (export)="export(item)"
    />
   }

   <button class="button" mat-raised-button color="primary" (click)="addIntegration()">
      + New integration
   </button>
</div>
