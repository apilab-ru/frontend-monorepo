<div class="root">
   <div class="chart">
      <canvas #chart></canvas>
   </div>

   <div class="legend">
      <div>Total {{ totalHours() }} hours</div>
      @for (item of chartItems(); track item.key; let index = $index) {
      <div class="item" (mouseover)="setActive(index)" (focus)="setActive(index)" tabindex="0">
         <span class="color" [style.backgroundColor]="item.color"></span>
         <span class="percent" [matTooltip]="item.hours + 'h'">{{ item.percent }}%</span>
         <span class="title">
            {{ item.name || item.key }}
         </span>
         <button mat-button class="details" (click)="openDetails(item)">details</button>
      </div>
      }
   </div>
</div>
