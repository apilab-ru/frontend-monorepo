<div class="help">
  <section class="row panel">
    <div class="script-heading">
      <h2 class="panel-title">Import script</h2>
      <button class="action-button" type="button" (click)="copyScript(scriptEditor.value)">
        <app-icon name="copy" />Copy script
      </button>
    </div>
    <textarea #scriptEditor class="script-export text-editor" aria-label="Jira import script" spellcheck="false">
      let list = [];
      document.querySelector('iframe')
          .contentWindow.document.querySelector('#reportContent')
          .querySelectorAll('tr').forEach(tr => {
      let item = [].reduce.bind(tr.querySelectorAll('td'))((prev, item, index) => ({
          ...prev, [index]: item.textContent
        }), {});
        list.push(item);
      });
      let clearedList = list.slice(1, list.length - 2).map(item => ([
        item['0'] + ' - ' + item['1'],
        item['2'],
        item['3'],
      ]))
      copy(clearedList);
      </textarea>
  </section>

  <section class="row panel">
    <h2 class="panel-title">Jira fields config</h2>
    <label class="domain-label">Jira domain <input class="domain-input" [ngModel]="domain()" (ngModelChange)="domain.set($event)"></label>
    <a
      class="calendar-link" rel="noopener noreferrer" target="_blank"
      href="https://{{ domain() }}/plugins/servlet/wtc-iframe?urlPath=workcalendar&decorator=atl.general&titleKey=wtc.common.labels.appName">
      Link to calendar
    </a>
    <img alt="Jira work calendar report field configuration" class="help-image" src="assets/jira-configuration.jpg">
  </section>
</div>
