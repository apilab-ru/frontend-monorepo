<header class="menu">
  <a class="brand" routerLink="/" aria-label="Worklog Analyze home">
    <app-icon name="logo" />
    <span>Worklog Analyze</span>
  </a>
  <nav class="navigation" aria-label="Main navigation">
    @for (item of menu; track item.path) {
      <a class="nav-link" [routerLink]="item.path" routerLinkActive="-active"
         [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page">
        <app-icon [name]="item.path === '' ? 'file-text' : 'book-open'" />
        {{ item.data?.name }}
      </a>
    }
  </nav>
  <div class="header-actions">
    <a class="github-link" target="_blank" rel="noopener noreferrer" [href]="githubLink">
      <app-icon name="github" /><span>GitHub</span>
    </a>
    <button class="theme-button" type="button" (click)="theme.toggle()"
      [attr.aria-pressed]="theme.dark()" aria-label="Toggle dark theme" title="Toggle light or dark theme">
      <app-icon name="sun" />
    </button>
  </div>
</header>
<main class="content"><router-outlet /></main>
