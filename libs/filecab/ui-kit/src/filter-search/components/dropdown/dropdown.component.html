<div class="root">
   @for (item of list$ | async; track item; let index = $index) {
   <div
      class="line-item"
      [class.-focus]="(index$ | async) === index"
      (click)="onSelectKey(item, $event)"
      (mouseover)="setIndex(index)"
   >
      <span class="name">{{ item.name }}</span>
      @if (item.key && (!item.values && !item.custom)) {
      <span
         class="button -plus"
         [class.-focus]="(index$ | async) === index && (positive$ | async)"
         (click)="onSelectKey(item, $event, false)"
      >
         +
      </span>
      <span
         class="button -minus"
         [class.-focus]="(index$ | async) === index && !(positive$ | async)"
         (click)="onSelectKey(item, $event, true)"
      >
         –
      </span>
      }
   </div>
   }
</div>
