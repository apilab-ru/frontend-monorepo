<div class="root">
   @for (item of options$ | async; track item; let index = $index) { @if (presets[item.key]; as preset) {
   <filecab-chip
      class="item"
      [item]="item"
      [preset]="preset"
      (removeChip)="onRemoveChip(index)"
      (click)="onEditChip(index, item)"
   ></filecab-chip>
   } }

   <filecab-input class="input item" [list]="list" (selectValue)="onAddValue($event)"></filecab-input>
</div>
