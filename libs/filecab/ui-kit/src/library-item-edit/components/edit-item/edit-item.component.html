<div class="root">
   <div class="card">
      <p-select-button
         class="types"
         [options]="types"
         [ngModel]="type"
         (ngModelChange)="onTypeUpdate($event)"
         optionLabel="name"
         optionValue="path"
      ></p-select-button>

      <div class="p-float-label text-box">
         <input class="input" id="float-input" type="text" pInputText [formControl]="nameControl" />
         <label for="float-input">Название материала</label>
      </div>
   </div>

   <div class="card">
      <ng-content></ng-content>
   </div>

   <div class="card" [formGroup]="formMeta">
      <div class="status-list">
         <p-select
            formControlName="status"
            [tooltip]="'Статус'"
            [options]="statuses"
            optionLabel="name"
            optionValue="status"
            scrollHeight="400px"
         ></p-select>

         @if (statusWithProgress.includes(formMeta.value.status)) {
         <filecab-progress
            class="progress"
            formControlName="progress"
            [total]="mediaItem?.episodes || 0"
         ></filecab-progress>
         }
      </div>

      @if (statusWithStars.includes(formMeta.value.status)) {
      <filecab-stars class="stars" formControlName="star"></filecab-stars>
      }

      <div class="comment-box p-float-label">
         <textarea formControlName="comment" id="comment" class="comment" pTextarea></textarea>
         <label for="comment">Комментарий</label>
      </div>

      @if (isMetaChanged(formMeta.getRawValue()) || needShowSave) {
      <div class="save-button-box">
         <p-button label="Сохранить" icon="pi pi-check" size="small" (click)="saveMeta()"></p-button>
      </div>
      }
   </div>
</div>
