<div class="root">
   <div class="data" [class.-empty]="!list?.length">
      @if (list?.length) { @for (item of list; track trackBy($index, item)) {
      <ng-container
         [ngTemplateOutlet]="rowTemplate"
         [ngTemplateOutletContext]="{
            $implicit: item,
            ngForOf: list,
            index: $index,
            count: $count,
            first: $first,
            last: $last,
            even: $even,
            odd: $odd
         }"
      ></ng-container>
      } } @else {
      <div class="message">Нет данных</div>
      }
   </div>

   <filecab-paginator class="paginator" [limitList]="limitList" [orderFields]="orderFields"></filecab-paginator>
</div>
