<div class="root">
   <div class="pages">
      <button
         pButton
         pRipple
         type="button"
         [iconOnly]="true"
         aria-label="Первая страница"
         [disabled]="(page$ | async) < 2"
         (click)="setPage(1)"
         class="p-button-rounded p-button-text p-button-secondary"
      >
         <i class="pi pi-angle-double-left" aria-hidden="true"></i>
      </button>
      <button
         pButton
         pRipple
         type="button"
         [iconOnly]="true"
         aria-label="Предыдущая страница"
         [disabled]="(page$ | async) < 2"
         (click)="prevPage()"
         class="p-button-rounded p-button-text p-button-secondary"
      >
         <i class="pi pi-angle-left" aria-hidden="true"></i>
      </button>
      <button
         pButton
         pRipple
         type="button"
         [iconOnly]="true"
         aria-label="Следующая страница"
         [disabled]="!(hasMore$ | async)"
         (click)="nextPage()"
         class="p-button-rounded p-button-text p-button-secondary"
      >
         <i class="pi pi-angle-right" aria-hidden="true"></i>
      </button>
      <button
         pButton
         pRipple
         type="button"
         [iconOnly]="true"
         aria-label="Последняя страница"
         [disabled]="!(canGoToLast$ | async)"
         (click)="lastPage()"
         class="p-button-rounded p-button-text p-button-secondary"
      >
         <i class="pi pi-angle-double-right" aria-hidden="true"></i>
      </button>
   </div>

   <div class="info">
      @if (page$ | async; as page) {
      <div class="page">
         {{ page }}
      </div>
      } @if (totalPages$ | async; as totalPages) {
      <div class="page -total">&nbsp;/ {{ totalPages }}</div>
      }

      <p-select
         class="limit"
         [options]="limitViewList"
         [ngModel]="limit$ | async"
         (ngModelChange)="updateLimit($event)"
         optionLabel="name"
         optionValue="key"
      ></p-select>

      @if (total$ | async; as total) {
      <div class="page">&nbsp;из {{ total }}</div>
      }
   </div>

   <div class="sort">
      <span class="p-float-label">
         <p-select
            inputId="orderField"
            class="dropdown-field"
            [options]="orderFields"
            [ngModel]="orderField$ | async"
            (ngModelChange)="setOrderField($event)"
            optionLabel="name"
            optionValue="key"
         ></p-select>
         <label for="orderField" class="label">Сортировать по</label>
      </span>

      <span class="p-float-label">
         <p-select
            inputId="orderType"
            class="dropdown-order"
            [ngModel]="orderType$ | async"
            (ngModelChange)="setOrderType($event)"
            [options]="orderTypeList"
            optionLabel="name"
            optionValue="key"
         ></p-select>
         <label for="orderType" class="label">Направление</label>
      </span>
   </div>
</div>
