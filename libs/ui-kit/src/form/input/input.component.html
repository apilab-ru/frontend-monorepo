@if (label) {
<label class="label" htmlFor="{{ id }}">
   {{ label }}
</label>
} @if (type === 'text') {
<input
   pInputText
   [id]="id"
   [attr.aria-describedby]="id + '-help'"
   [class.ng-invalid]="error$ | async"
   [ngModel]="value$ | async"
   (ngModelChange)="updateValue($event)"
   (focusout)="touch()"
/>
} @if (type === 'password') {
<p-password
   class="password"
   [id]="id"
   [attr.aria-describedby]="id + '-help'"
   [class.ng-invalid]="error$ | async"
   [ngModel]="value$ | async"
   (ngModelChange)="updateValue($event)"
   (focusout)="touch()"
   [toggleMask]="true"
   [feedback]="false"
></p-password>
} @if (error$ | async; as error) {
<small class="error" [id]="id + '-help'">
   {{ error }}
</small>
}
