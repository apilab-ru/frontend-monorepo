<div class="ui-table-box">
   <table class="ui-table">
      <thead class="ui-table-head">
         @for (item of headerQueryList.toArray(); track item) {
         <td class="ui-table-td -head -{{ item.class }}">
            <ng-container *ngTemplateOutlet="item.templateRef"></ng-container>
         </td>
         }
      </thead>

      <tbody>
         @for ( of list; track trackBy($index, )) {
         <ng-template [ngForOf]="list" [ngForTrackBy]="trackBy" [ngForTemplate]="rowTemplate"></ng-template>
         }
      </tbody>
   </table>
</div>
